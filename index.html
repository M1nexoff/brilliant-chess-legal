<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brilliant Chess</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e7e9ee;
      --muted: #a2a8b4;
      --accent: #3fb27f;
      --border: #262b34;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-size: 1.9rem; margin: 0 0 6px; }
    p, li { color: var(--text); }
    .muted { color: var(--muted); font-size: 0.92rem; }
    a { color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin: 22px 0; }
    .card a { display: block; padding: 6px 0; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Brilliant Chess</h1>
    <p class="muted">Chess for Android &mdash; play online, against the computer, or solve puzzles offline.</p>

    <div class="card">
      <a href="https://play.google.com/store/apps/details?id=uz.m1nex.brilliantchess">Get it on Google Play</a>
      <a href="privacy">Privacy Policy</a>
      <a href="delete-account">Delete your account</a>
    </div>

    <p class="muted">
      Contact: <a href="mailto:m1nexsupport@gmail.com">m1nexsupport@gmail.com</a>
    </p>
  </div>
</body>
</html>
